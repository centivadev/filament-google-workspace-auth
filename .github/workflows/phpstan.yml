name: PHPStan

# No paths filter: these jobs are required status checks on main, and a filtered workflow
# simply never reports on a PR that does not touch the filtered paths, leaving the check
# permanently pending and the PR unmergeable. Running them on every PR is the cheap fix.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must match the dev toolchain, not the package minimum: pest ^5 requires PHP ^8.4.
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
