name: "Fix PHP Code Styling"

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must match the dev toolchain, not the package minimum: pest ^5 requires PHP ^8.4.
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Fix PHP code style issues (main only)
        if: github.ref == 'refs/heads/main'
        uses: aglipanci/laravel-pint-action@2.6

      - name: Commit changes (main only)
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Fix styling

      - name: Check PHP code style (PRs)
        if: github.event_name == 'pull_request'
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true
