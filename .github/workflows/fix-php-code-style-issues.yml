name: "Check PHP Code Styling"

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

# Read-only: this used to run Pint in fix mode on main and push the result back with
# git-auto-commit-action. That is incompatible with the required status checks now protecting
# main, so styling is a blocking check and fixes are made in the branch via `composer format`.
permissions:
  contents: read

jobs:
  php-code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must match the dev toolchain, not the package minimum: pest ^5 requires PHP ^8.4.
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Check PHP code style
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true
